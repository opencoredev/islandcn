allowBuilds:
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - blume@2.2.7
  - express-rate-limit@8.7.5

# Copy packages out of the shared store so tools in other projects can't rewrite ours.
packageImportMethod: copy

# Security overrides for transitive copies pulled in through blume.
overrides:
  "@hono/node-server@2.1.6": 2.1.11
  dompurify@3.4.17: 3.5.0
  express-rate-limit@8.7.3: 8.7.5
  fast-xml-builder@1.3.1: 1.3.2
  fast-xml-parser@5.12.0: 5.12.1
  hono@4.13.17: 4.13.18
  "@dotenvx/dotenvx@1.75.1>open@8.4.2": 11.0.0
  path-to-regexp@6.1.0: 6.3.0
  postcss-selector-parser@6.0.10: 6.1.6
  postcss-selector-parser@6.1.5: 6.1.6
  postcss-selector-parser@7.1.7: 7.1.8
  systeminformation@5.33.18: 5.33.23
  undici@7.30.1: 7.30.2
  undici@8.12.3: 8.12.4
  vite@8.3.6: 8.3.7
